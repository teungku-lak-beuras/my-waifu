product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

apply:
  - //configuration/jvm.module-template.yaml

dependencies:
  - //core/local
  - //core/model
  - //core/network
  - //core/repository
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.androidx.navigation3.ui
  - $libs.compose.material.windowsize

  # Napier
  - $libs.napier

  # KotlinX serialisation
  - $libs.kotlinx.serialization.json

  # Coil, requires Ktor Client CIO
  - $libs.coil.compose
  - $libs.coil.network.ktor

  # Ktor
  - $libs.ktor.client.cio

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: zeef.mywaifu.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization:
      enabled: true
      version: 1.12.0
